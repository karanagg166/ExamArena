name: Exam Arena Post-Deployment Live Smoke

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exam-arena-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Real Vercel + FastAPI + Database API Contracts
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Production Deployment Smoke Suite
        env:
          PROD_FRONTEND_URL: "https://exam-arena-mu.vercel.app"
          PROD_API_URL: "https://exam-arena-mu.vercel.app"
          SMOKE_WAIT_SECONDS: "180"
          PROD_SMOKE_BEARER_TOKEN: ${{ secrets.PROD_SMOKE_BEARER_TOKEN }}
        run: python3 scripts/ci_production_smoke.py
