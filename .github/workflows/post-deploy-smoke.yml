name: Exam Arena Post-Deployment Live Smoke

# Dispatch after deployment succeeds; pre-deploy CI is a separate prerequisite.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full main revision already deployed to the API
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: exam-arena-production-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    name: Deployment contracts (authenticated Search Sphere journey is separate)
    if: github.ref == 'refs/heads/main'
    environment: search-sphere-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate main deployment revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          sha = os.environ['EXPECTED_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha), 'Full lowercase SHA required'
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'HEAD'], check=True)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Production Deployment Smoke Suite
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PROD_FRONTEND_URL: "https://exam-arena-mu.vercel.app"
          PROD_API_URL: "https://exam-arena-mu.vercel.app"
          SMOKE_WAIT_SECONDS: "180"
          PROD_SMOKE_BEARER_TOKEN: ${{ secrets.PROD_SMOKE_BEARER_TOKEN }}
        run: python3 scripts/ci_production_smoke.py
