name: 🔍 Develop Branch Checks

# ─────────────────────────────────────────────────────────────
#  Runs on every PR targeting develop.
#  Executes containerized linting, type checks, and tests.
# ─────────────────────────────────────────────────────────────
on:
  pull_request:
    branches: [develop]

concurrency:
  group: develop-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  develop-gate:
    name: 🔍 Develop CI Pipeline (Docker Native)
    runs-on: ubuntu-latest
    steps:
      # 1. Setup & Environment
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create root .env from secrets
        run: |
          cat <<'EOF' > .env
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/exam_arena
          SECRET_KEY=${{ secrets.SECRET_KEY || 'ci-secret-key-for-testing-only-32-chars-long' }}
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          ENVIRONMENT=ci
          ALLOWED_ORIGINS=http://localhost:3000
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          EOF

      # 2. Build & Start Stack
      - name: Build and Start Services
        run: docker compose up -d --build

      - name: Wait for Backend Health
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            RESPONSE=$(curl --silent http://localhost:8000/health 2>/dev/null || true)
            if echo "$RESPONSE" | grep -q '"healthy"'; then
              echo "✅ Backend ready"
              exit 0
            fi
            echo "  attempt $i/30 — $RESPONSE"
            sleep 3
          done
          echo "❌ Backend never became ready"
          docker compose logs backend
          exit 1

      # 3. Database Schema Initialization
      - name: Database Schema Init
        run: docker compose exec -T backend python -c "import asyncio; from app.core.database import init_db; asyncio.run(init_db())"

      # 4. Backend Checks (FastAPI)
      - name: 🐍 Check Formatting (Black)
        run: docker compose exec -T backend black --check app/

      - name: 🐍 Strict Linting (Ruff)
        run: docker compose exec -T backend ruff check app/

      - name: 🐍 Strict Typing (Mypy)
        run: docker compose exec -T backend mypy app/

      - name: 🧪 Backend Pytest Suite
        run: docker compose exec -T backend pytest -v

      # 5. Frontend Checks (Next.js)
      - name: ⚡ Strict Linting (ESLint)
        run: docker compose exec -T frontend pnpm lint

      - name: ⚡ Strict Typing (TypeScript)
        run: docker compose exec -T frontend pnpm type-check

      - name: 🧪 Frontend Vitest Suite
        run: docker compose exec -T frontend pnpm test:run

      # 6. Cleanup & Logs
      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== BACKEND LOGS ==="
          docker compose logs backend
          echo "=== FRONTEND LOGS ==="
          docker compose logs frontend

      - name: Teardown
        if: always()
        run: docker compose down