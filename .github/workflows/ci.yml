name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Unit & Component Tests
        run: pnpm test:run

      - name: Production Build
        run: pnpm build

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E Tests
        run: pnpm test:e2e

  backend:
    name: Backend (Ruff, Pytest Unit Tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exam_arena
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/exam_arena
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/exam_arena_test
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-secret-key-for-testing-only-32-chars-long
      ENVIRONMENT: ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff Lint Check
        run: |
          ruff check backend/app backend/tests

      - name: Pytest Test Suite
        run: |
          pytest backend/tests

  worker-integration:
    name: Worker & Queue Integration (ARQ + Redis + PostgreSQL)
    runs-on: ubuntu-24.04
    needs: [backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exam_arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/exam_arena_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/exam_arena_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-for-testing-only-32-chars-long
      ENVIRONMENT: test
      COHERE_STUB_MODE: "true"
      ALLOW_IN_PROCESS_IMPORT_FALLBACK: "false"
      FILE_STORAGE_PROVIDER: "local"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Initialize Database Schema
        run: |
          PYTHONPATH=backend python backend/seed_e2e.py

      - name: Start FastAPI Application and ARQ Worker
        run: |
          PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port 8000 > fastapi_worker_test.log 2>&1 &
          PYTHONPATH=backend python -m arq app.imports.worker.WorkerSettings > arq_worker_test.log 2>&1 &

      - name: Verify Backend and Worker Readiness
        run: |
          READY=0
          for i in {1..30}; do
            if curl -s http://localhost:8000/health/ready | grep -q '"status":"ready"'; then
              echo "Backend API is ready with PostgreSQL and Redis connected!"
              READY=1
              break
            fi
            echo "Waiting for API readiness... ($i/30)"
            sleep 1
          done
          if [ $READY -ne 1 ]; then
            echo "Backend failed readiness check within timeout"
            cat fastapi_worker_test.log
            exit 1
          fi

          WORKER_READY=0
          for i in {1..30}; do
            if curl -s http://localhost:8000/health/worker | grep -q '"worker_available":true'; then
              echo "ARQ Worker is verified active and consuming jobs!"
              WORKER_READY=1
              break
            fi
            echo "Waiting for worker heartbeat... ($i/30)"
            sleep 1
          done
          if [ $WORKER_READY -ne 1 ]; then
            echo "Worker failed availability check within timeout"
            cat arq_worker_test.log
            exit 1
          fi

      - name: Run Dedicated Queue & Worker Lifecycle Integration Suite
        run: |
          PYTHONPATH=backend pytest backend/tests/integration/test_worker_queue_lifecycle.py backend/tests/integration/test_both_document_paths.py -v

      - name: Upload Worker Integration Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worker-integration-logs
          path: |
            fastapi_worker_test.log
            arq_worker_test.log

  fullstack:
    name: Full-Stack E2E (Real Services)
    runs-on: ubuntu-24.04
    needs: [frontend, backend, worker-integration]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exam_arena
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/exam_arena
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-secret-key-for-testing-only-32-chars-long
      ENVIRONMENT: ci
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Seed Full-Stack E2E Fixtures
        run: |
          PYTHONPATH=backend python backend/seed_e2e.py

      - name: Production Build
        run: pnpm build

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start FastAPI Backend
        run: |
          PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          READY=0
          for i in {1..30}; do
            if curl -s http://localhost:8000/health/ready | grep -q '"status":"ready"'; then
              echo "FastAPI backend is ready!"
              READY=1
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 1
          done
          if [ $READY -ne 1 ]; then
            echo "FastAPI backend failed to become ready within timeout"
            exit 1
          fi

      - name: Run Full-Stack Playwright Tests
        run: pnpm test:e2e:fullstack
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000
