services:
  - type: web
    name: examarena-backend
    runtime: docker
    dockerfilePath: backend/backend.Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000

  - type: worker
    name: examarena-worker
    runtime: docker
    dockerfilePath: backend/worker.Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true

